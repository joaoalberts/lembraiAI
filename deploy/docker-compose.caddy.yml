# Overlay para VPS com as portas 80/443 LIVRES: o Caddy obtém e renova o certificado HTTPS sozinho.
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml --env-file .env up -d
# Para testar localmente sem HTTPS: PUBLIC_HOST=:80 GATEWAY_HTTP_PORT=8088 (o Caddy não faz HTTPS automático em ":80").
services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [auth, rest, web]
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]

volumes:
  caddy-data: {}
  caddy-config: {}
