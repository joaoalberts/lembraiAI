# Site estático do Expo (`expo export --platform web`): /privacidade -> privacidade.html, /auth/login -> auth/login.html, etc.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # arquivos com hash no nome: cache longo
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /lembreiai.apk {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="lembreiai.apk"';
        try_files $uri =404;
    }

    error_page 404 /+not-found.html;
}
